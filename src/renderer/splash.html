<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoingHub 正在启动</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
    }
    .logo-container {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 24px;
    }
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 28px;
      border: 2px solid #38bdf8;
      animation: pulse 2.4s infinite ease-out;
    }
    .logo-box {
      width: 100%;
      height: 100%;
      border-radius: 26px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px -5px rgba(14, 165, 233, 0.35);
    }
    .logo-text {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }
    h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
      transition: all 0.2s;
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.9; }
      100% { transform: scale(1.35); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="pulse-ring"></div>
    <div class="logo-box">
      <span class="logo-text">Hub</span>
    </div>
  </div>
  <h2>GoingHub</h2>
  <p id="status-text">正在启动本地 API 网关服务...</p>
  <div class="spinner"></div>

  <script>
    // 监听来自 Electron 主进程的启动状态更新
    if (window.electronAPI && window.electronAPI.onStatusUpdate) {
      window.electronAPI.onStatusUpdate((status) => {
        const el = document.getElementById('status-text');
        if (el) el.innerText = status;
      });
    }
  </script>
</body>
</html>
