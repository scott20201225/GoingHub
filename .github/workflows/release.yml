name: Release GoingHub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag strictly formatted as vX.Y.Z (e.g. v2.2.0)'
        required: true
        default: 'v2.2.0'

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve release ref
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_RELEASE_TAG:-v2.2.0}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "release_tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Target release tag: ${tag}"

  validate:
    name: Validate tag
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Validate semver tag
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          tag="${RELEASE_TAG}"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a valid semver (expected vX.Y.Z[-prerelease][+build])"
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: [resolve, validate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-latest
            platform: mac
            arch: arm64
            script: build:mac:arm64
          - name: mac-x64
            os: macos-latest
            platform: mac
            arch: x64
            script: build:mac:x64
          - name: win-x64
            os: windows-latest
            platform: win
            arch: x64
            script: build:win:x64
          - name: win-arm64
            os: windows-latest
            platform: win
            arch: arm64
            script: build:win:arm64
          - name: linux-x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            script: build:linux:x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            script: build:linux:arm64

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick xz-utils

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Sync package.json version with release tag
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const cleanVer = (process.env.RELEASE_TAG || '').replace(/^v/, '');
            if (cleanVer) {
              pkg.version = cleanVer;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              console.log('package.json version dynamically synchronized to: ' + cleanVer);
            }
          "

      - name: Build target
        run: npm run ${{ matrix.script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: goinghub-${{ matrix.name }}
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz

  release:
    name: Publish Release
    needs: [resolve, validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-raw

      - name: Flatten and stage artifacts
        run: |
          mkdir -p dist
          find dist-raw -type f \( \
            -name "*.dmg" -o \
            -name "*.zip" -o \
            -name "*.exe" -o \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.tar.gz" -o \
            -name "*.blockmap" -o \
            -name "*.yml" \
          \) -exec cp -f {} dist/ \;
          echo "--- Staged release files ---"
          ls -la dist/

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          shasum -a 256 *.dmg *.zip *.exe *.AppImage *.deb *.tar.gz > SHA256SUMS.txt 2>/dev/null || \
          sha256sum *.dmg *.zip *.exe *.AppImage *.deb *.tar.gz > SHA256SUMS.txt 2>/dev/null || true
          echo "--- Generated SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Compose release notes body
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          {
            echo "## GoingHub ${RELEASE_TAG}"
            echo
            echo "Multi-Protocol AI Gateway Desktop Client (macOS, Windows & Linux)"
            echo
            echo "### 📦 支持平台与架构"
            echo "- **macOS**: Apple Silicon (\`arm64\`) / Intel (\`x64\`)"
            echo "- **Windows**: 64 位 (\`x64\`) / ARM64 (\`arm64\`)"
            echo "- **Linux**: x86_64 (\`x64\`) / AArch64 (\`arm64\`)"
            echo
            echo "### 说明"
            echo "- 原生跨平台桌面客户端，免去手动终端命令与 Docker 部署，开箱即用，托盘常驻"
            echo "- 内嵌独立便携 Python 3.11 环境，无需预装任何运行库"
            echo "- 全面兼容 OpenAI Chat / Responses / Anthropic Messages / 图像与视频多模态协议"
            echo "- 系统托盘常驻，图标自适应深色/浅色主题"
            echo
            echo "### ⚠️ 免责声明 (Disclaimer)"
            echo "本项目仅用于协议学习与个人开发测试，不提供任何商业服务或可用性担保。因使用非官方客户端产生的账号风控、限制或封禁由使用者自行承担，请优先使用官方客户端。"
            echo "*(This project is intended solely for protocol study and personal development/testing, without any commercial service or availability warranty. Any account risk control, restriction, or ban resulting from using unofficial clients is entirely the user's responsibility. Please prioritize using official clients.)*"
            echo
            cat .github/release-notes/macos-unsigned-zh-CN.md
            echo
            echo "## 校验下载文件 (Verifying downloads)"
            echo "所有发布安装包的 SHA-256 校验和均记录在 \`SHA256SUMS.txt\` 中，可使用以下命令校验："
            echo '```bash'
            echo 'sha256sum -c SHA256SUMS.txt --ignore-missing'
            echo '```'
          } > release_body.md

      - name: Create draft release with assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(needs.resolve.outputs.release_tag, '-') }}
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          name: ${{ needs.resolve.outputs.release_tag }}
          body_path: release_body.md
          fail_on_unmatched_files: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote draft to published release
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${RELEASE_TAG}" --draft=false --repo "${GITHUB_REPOSITORY}"
