<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="indigoPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="36" y="36" width="440" height="440" rx="98" ry="98" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4.5" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="160" fill="url(#hubGlow)"/>

  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="124" fill="none" stroke="url(#cyanIndigo)" stroke-width="4" stroke-dasharray="6 12" stroke-opacity="0.5"/>
    <path d="M 0,-105 L 91,52.5 L -91,52.5 Z" fill="none" stroke="url(#cyanIndigo)" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 0,105 L -91,-52.5 L 91,-52.5 Z" fill="none" stroke="url(#indigoPurple)" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/>

    <line x1="0" y1="-105" x2="0" y2="0" stroke="url(#cyanIndigo)" stroke-width="5" stroke-linecap="round"/>
    <line x1="91" y1="52.5" x2="0" y2="0" stroke="url(#cyanIndigo)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-91" y1="52.5" x2="0" y2="0" stroke="url(#cyanIndigo)" stroke-width="5" stroke-linecap="round"/>

    <circle cx="0" cy="-105" r="18" fill="#18181b" stroke="#38bdf8" stroke-width="6"/>
    <circle cx="0" cy="-105" r="7" fill="#38bdf8"/>

    <circle cx="91" cy="52.5" r="18" fill="#18181b" stroke="#818cf8" stroke-width="6"/>
    <circle cx="91" cy="52.5" r="7" fill="#818cf8"/>

    <circle cx="-91" cy="52.5" r="18" fill="#18181b" stroke="#c084fc" stroke-width="6"/>
    <circle cx="-91" cy="52.5" r="7" fill="#c084fc"/>

    <circle cx="0" cy="0" r="38" fill="#09090b" stroke="url(#cyanIndigo)" stroke-width="6"/>
    <circle cx="0" cy="0" r="20" fill="url(#coreGrad)"/>
  </g>
</svg>